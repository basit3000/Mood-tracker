<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            flex: 1;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: none;
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            text-align: center;
            padding: 20px;
            border-bottom: none;
        }
        
        .form-label {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }
        
        .form-control, .form-select {
            border-radius: 8px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 0.25rem rgba(106, 17, 203, 0.15);
        }
        
        .btn-primary {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        
        .mood-option {
            transition: transform 0.3s;
        }
        
        .mood-option:hover {
            transform: scale(1.05);
        }
        
        .footer {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 30px;
        }
        
        .mood-icon {
            font-size: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .character {
            position: absolute;
            right: 20px;
            bottom: 20px;
            font-size: 100px;
            opacity: 0.1;
            transform: rotate(10deg);
        }
        
        .login-prompt {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-smile-beam me-2"></i>MoodTracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/public/dashboard"><i class="fas fa-home me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-history me-1"></i> History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mood/updateDetails"><i class="fas fa-user me-1"></i> Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0"><i class="fas fa-feather-alt me-2"></i>How are you feeling today?</h3>
                        <p class="mb-0 mt-2">Share your mood and thoughts with us</p>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/mood/editNote}" th:object="${Note}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{date}" />
                            <input type="hidden" th:field="*{userId}" />
                            <!-- Mood Selection -->
                            <div class="mb-4">
                                <label for="feel" class="form-label">
                                    <i class="fas fa-heart me-1"></i> Select Your Mood
                                </label>
                                <select class="form-select"  th:field="*{feel}" id="feel" required>
                        
                                    <option value="HAPPY">😊 HAPPY</option>
                                    <option value="SAD">😢 SAD</option>
                                    <option value="ANGRY">😠 ANGRY</option>
                                    <option value="BORED">😑 BORED</option>
                                    <option value="EXCITED">🤩 EXCITED</option>
                                    <option value="CALM">😌 CALM</option>
                                </select>
                            </div>

                            <!-- Note Field -->
                            <div class="mb-4">
                                <label for="note" class="form-label">
                                    <i class="fas fa-sticky-note me-1"></i> Add a Note (Optional)
                                </label>
                                <input type="text" th:field="*{note}" id="note" class="form-control"  />
                                <textarea class="form-control" id="note" rows="4" placeholder="Share what's on your mind..."></textarea>
                                <div class="form-text">Express yourself! Your thoughts are valuable.</div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-paper-plane me-2"></i>Submit Your Mood
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">© 2023 MoodTracker. All rights reserved.</p>
            <p class="mb-0">Designed with <i class="fas fa-heart text-danger"></i> for better mental health</p>
        </div>
    </footer>

    <!-- Decorative Element -->
    <div class="character d-none d-md-block">
        <i class="fas fa-user-astronaut"></i>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
